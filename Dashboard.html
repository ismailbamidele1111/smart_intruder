<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Guard</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    background: #0b1120; color: #f1f5f9; margin: 0;
    display: flex; justify-content: center; padding: 32px 16px; min-height: 100vh;
  }
  .card { width: 100%; max-width: 420px; }
  .top { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
  .top b { color: #f1f5f9; font-size: 16px; }
  .conn { display: flex; align-items: center; gap: 6px; }
  .conn i { width: 8px; height: 8px; border-radius: 50%; background: #64748b; display: inline-block; }
  .conn.on i { background: #22c55e; }

  #authScreen { display: none; }
  #authScreen h2 { text-align: center; font-size: 20px; margin-bottom: 4px; }
  #authScreen p.sub { text-align: center; color: #94a3b8; font-size: 13.5px; margin-bottom: 24px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; color: #94a3b8; margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 13px 14px; border-radius: 10px; border: 1px solid #334155;
    background: #131c31; color: #f1f5f9; font-size: 15px;
  }
  .field input:focus { outline: none; border-color: #3b82f6; }
  #authError { color: #f87171; font-size: 13px; min-height: 18px; margin-bottom: 6px; text-align: center; }
  .authBtn {
    width: 100%; padding: 14px; border: 0; border-radius: 12px; font-size: 15px; font-weight: 600;
    cursor: pointer; margin-bottom: 12px; color: #fff; background: #2563eb;
  }
  .switchMode { text-align: center; font-size: 13.5px; color: #94a3b8; }
  .switchMode a { color: #60a5fa; cursor: pointer; text-decoration: underline; }

  #appScreen { display: none; }
  .armedRow {
    display: flex; justify-content: space-between; align-items: center;
    background: #131c31; border-radius: 12px; padding: 14px 16px; margin-bottom: 18px;
  }
  .armedRow span { font-size: 14.5px; }
  .armedRow button {
    border: 0; border-radius: 8px; padding: 9px 16px; font-size: 13.5px; font-weight: 600;
    color: #fff; background: #2563eb; cursor: pointer;
  }
  .armedRow.off button { background: #16a34a; }
  .armedRow .dot { width: 9px; height: 9px; border-radius: 50%; background: #22c55e; display: inline-block; margin-right: 8px; }
  .armedRow.off .dot { background: #64748b; }

  #feed { display: flex; flex-direction: column; gap: 10px; }
  .feedItem {
    background: #131c31; border-left: 3px solid #ef4444; border-radius: 8px;
    padding: 12px 14px; font-size: 14.5px;
  }
  .feedItem .time { color: #94a3b8; font-size: 12.5px; margin-top: 2px; }
  .empty { text-align: center; color: #64748b; font-size: 14px; padding: 30px 0; }

  button.wide {
    width: 100%; padding: 14px; border: 0; border-radius: 12px; font-size: 14.5px; font-weight: 600;
    cursor: pointer; margin-top: 18px; color: #fff; background: #334155;
  }
</style>
</head>
<body>
<div class="card" id="app">

  <div class="top"><b>🏠 Home Guard</b><span class="conn" id="conn"><i></i><span id="connTxt">—</span></span></div>

  <div id="authScreen">
    <h2 id="authTitle">Log in</h2>
    <p class="sub" id="authSub">Access your Home Guard dashboard</p>

    <div class="field">
      <label>Email</label>
      <input type="email" id="emailInput" placeholder="you@example.com">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="passwordInput" placeholder="At least 6 characters">
    </div>

    <div id="authError"></div>

    <button class="authBtn" id="authSubmitBtn">Log in</button>
    <p class="switchMode" id="switchMode">Don't have an account? <a id="switchLink">Sign up</a></p>
  </div>

  <div id="appScreen">
    <div class="armedRow" id="armedRow">
      <span><span class="dot"></span><span id="armedLabel">Protected</span></span>
      <button id="toggleBtn">Turn off</button>
    </div>

    <div id="feed">
      <div class="empty" id="emptyMsg">No alerts yet</div>
    </div>

    <button class="wide" id="notifBtn">🔔 Enable alerts on this device</button>
    <button class="wide" id="logoutBtn">Log out</button>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const $ = (id) => document.getElementById(id);

  let mode = "login";

  function setMode(newMode) {
    mode = newMode;
    $("authError").textContent = "";
    if (mode === "login") {
      $("authTitle").textContent = "Log in";
      $("authSub").textContent = "Access your Home Guard dashboard";
      $("authSubmitBtn").textContent = "Log in";
      $("switchMode").innerHTML = 'Don\'t have an account? <a id="switchLink">Sign up</a>';
    } else {
      $("authTitle").textContent = "Sign up";
      $("authSub").textContent = "Create an account for Home Guard";
      $("authSubmitBtn").textContent = "Sign up";
      $("switchMode").innerHTML = 'Already have an account? <a id="switchLink">Log in</a>';
    }
    document.getElementById("switchLink").onclick = () => setMode(mode === "login" ? "signup" : "login");
  }
  setMode("login");

  $("authSubmitBtn").onclick = () => {
    const email = $("emailInput").value.trim();
    const pass = $("passwordInput").value;
    $("authError").textContent = "";
    if (!email || !pass) { $("authError").textContent = "Enter both email and password."; return; }
    const action = mode === "login"
      ? auth.signInWithEmailAndPassword(email, pass)
      : auth.createUserWithEmailAndPassword(email, pass);
    action.catch((err) => { $("authError").textContent = err.message; });
  };

  $("logoutBtn").onclick = () => auth.signOut();

  let dbListenersAttached = false;
  let historyCache = {};

  function ago(ms) {
    const s = Math.floor((Date.now() - ms) / 1000);
    if (s < 60) return "just now";
    const m = Math.floor(s / 60);
    if (m < 60) return m + (m === 1 ? " minute ago" : " minutes ago");
    const h = Math.floor(m / 60);
    if (h < 24) return h + (h === 1 ? " hour ago" : " hours ago");
    const d = Math.floor(h / 24);
    return d + (d === 1 ? " day ago" : " days ago");
  }

  function renderFeed() {
    const feed = $("feed");
    const entries = Object.entries(historyCache).sort((a, b) => b[0] - a[0]);
    if (entries.length === 0) {
      feed.innerHTML = '<div class="empty" id="emptyMsg">No alerts yet</div>';
      return;
    }
    feed.innerHTML = entries.slice(0, 20).map(([epoch, zoneName]) => {
      const ms = Number(epoch) * 1000;
      return '<div class="feedItem">Intruder detected' + (zoneName ? ' at ' + zoneName : '') +
             '<div class="time">' + ago(ms) + '</div></div>';
    }).join("");
  }

  function renderArmed(armed) {
    const row = $("armedRow");
    row.classList.toggle("off", !armed);
    $("armedLabel").textContent = armed ? "Protected" : "Protection off";
    $("toggleBtn").textContent = armed ? "Turn off" : "Turn on";
  }

  function attachDbListeners() {
    if (dbListenersAttached) return;
    dbListenersAttached = true;
    const db = firebase.database();

    db.ref(".info/connected").on("value", (s) => {
      $("conn").classList.toggle("on", s.val() === true);
      $("connTxt").textContent = s.val() === true ? "Online" : "Offline";
    });

    let armedNow = true;
    db.ref("alarm/armed").on("value", (s) => { armedNow = s.val() !== false; renderArmed(armedNow); });
    $("toggleBtn").onclick = () => db.ref("alarm/armed").set(!armedNow);

    db.ref("alarm/history").limitToLast(20).on("child_added", (s) => {
      historyCache[s.key] = s.val();
      renderFeed();
      if ("Notification" in window && Notification.permission === "granted" && Date.now() - Number(s.key) * 1000 < 15000) {
        new Notification("Intruder detected!", { body: s.val() ? "Intruder detected at " + s.val() : "Intruder detected" });
      }
    });

    setInterval(renderFeed, 30000);

    $("notifBtn").onclick = () => {
      if ("Notification" in window) {
        Notification.requestPermission().then((p) => {
          $("notifBtn").textContent = p === "granted" ? "🔔 Alerts enabled" : "Alerts blocked by browser";
        });
      }
    };
  }

  auth.onAuthStateChanged((user) => {
    if (user) {
      $("authScreen").style.display = "none";
      $("appScreen").style.display = "block";
      attachDbListeners();
    } else {
      $("appScreen").style.display = "none";
      $("authScreen").style.display = "block";
    }
  });
</script>
</body>
</html>
